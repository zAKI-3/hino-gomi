<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ごみ分別">
<meta name="theme-color" content="#f2f3f0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ごみ分別（日野市）</title>
<style>
:root{
  --bg:#f2f3f0;--card:#fff;--text:#1c1d1f;--sub:#6e7177;--line:#e4e6e1;--accent:#2e7d4f;
  --tab:rgba(250,250,248,.86);--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{--bg:#111213;--card:#1d1e20;--text:#f1f1f1;--sub:#9a9da3;--line:#2c2d30;--tab:rgba(28,29,31,.86);--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{display:none;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(96px + env(safe-area-inset-bottom))}
.view.on{display:block}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:10px 2px 14px}
.top h1{font-size:30px;font-weight:800;letter-spacing:.01em;margin:0}
.top small{color:var(--sub);font-size:13px}
.sec{font-size:13px;font-weight:700;color:var(--sub);margin:22px 4px 8px;letter-spacing:.04em}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
/* ホーム */
.hero{padding:16px}
.hero .d{display:flex;justify-content:space-between;align-items:baseline}
.hero .d b{font-size:20px}.hero .d span{color:var(--sub);font-size:13px}
.pills{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.pill{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;color:#fff;font-weight:700;font-size:16px}
.pill .ic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.none{padding:18px 4px 6px;color:var(--sub);display:flex;gap:10px;align-items:center}
.week .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.week .row:last-child{border:0}
.week .dt{width:62px;font-weight:700;font-size:15px}.week .dt small{display:block;color:var(--sub);font-weight:500;font-size:12px}
.week .row.today .dt{color:var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 8px 4px 5px;border-radius:99px}
.dot svg.i{width:15px;height:15px}
.tip{display:flex;gap:10px;align-items:center;padding:12px 14px;color:var(--sub);font-size:13px;margin-top:12px}
/* 分別 */
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px;margin:0 -2px}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;box-shadow:var(--shadow)}
.sbox svg{color:var(--sub);width:20px;height:20px}
.sbox input{flex:1;border:0;outline:0;background:none;font-size:17px;padding:13px 0;color:var(--text)}
.sbox .x{color:var(--sub);font-size:15px;display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;text-align:left;min-height:112px}
.badge{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff}
.tile b{font-size:16px}.tile small{color:var(--sub);font-size:12px;margin-top:-6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--card);border-radius:99px;padding:8px 13px;font-size:14px;box-shadow:var(--shadow)}
.list{overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border:0}
.li .badge{width:34px;height:34px;border-radius:10px}.li .badge svg{width:19px;height:19px}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:500;font-size:15px}.li .t small{color:var(--sub);font-size:12px}
.chev{color:var(--sub);opacity:.6}
.empty{padding:20px;text-align:center;color:var(--sub);font-size:14px}
/* 種類の画面 */
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;margin:8px 0 4px -6px}
.cathead{display:flex;align-items:center;gap:14px;padding:16px}
.cathead .badge{width:60px;height:60px;border-radius:18px}.cathead .badge svg{width:32px;height:32px}
.cathead h2{margin:0;font-size:22px}.cathead p{margin:4px 0 0;font-size:14px;font-weight:700}
.howto{padding:14px 16px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.howto h3{font-size:13px;color:var(--sub);margin:0 0 4px}
.seg{display:flex;gap:6px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.seg button{white-space:nowrap;padding:7px 12px;border-radius:99px;background:var(--card);font-size:14px;box-shadow:var(--shadow)}
.seg button.on{color:#fff}
/* カレンダー */
.mhead{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px}
.mhead b{font-size:18px}
.mhead button{width:36px;height:36px;border-radius:99px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.mhead button:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:8px;gap:2px}
.cal .w{font-size:11px;color:var(--sub);text-align:center;padding:4px 0}
.cal .c{cursor:pointer;min-height:62px;border-radius:10px;padding:4px 2px;text-align:center}
.cal .c.today{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.cal .n{font-size:13px;font-weight:600}
.cal .c.sun .n{color:#d64545}.cal .c.sat .n{color:#3b7dd8}
.cal .ics{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:3px}
.cal .ics span{width:17px;height:17px;border-radius:5px;display:grid;place-items:center;color:#fff}
.cal .ics svg{width:11px;height:11px;stroke-width:2.4}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;padding:14px 16px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend span{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff}
.legend svg{width:13px;height:13px}
.foot{font-size:12px;color:var(--sub);line-height:1.6;margin:20px 4px 0}
/* タブバー */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:var(--tab);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);z-index:20}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub);width:90px}
.tabbar button.on{color:var(--accent)}
/* シート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.2s;z-index:30}
.sheet .sec{margin:16px 0 8px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:31;max-height:82vh;overflow:auto}
.noanim .sheet,.noanim .sheet-bg{transition:none}
.open .sheet-bg{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh-top{display:flex;gap:14px;align-items:center}
.sh-top .badge{width:56px;height:56px;border-radius:16px}.sh-top .badge svg{width:30px;height:30px}
.sh-top h2{margin:0;font-size:20px;line-height:1.3}
.sh-top p{margin:4px 0 0;font-weight:700}
.next{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:14px;font-weight:700}
.note{margin-top:14px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.sh-btn{margin-top:16px;width:100%;padding:13px;border-radius:14px;background:var(--bg);font-weight:600;color:var(--accent)}
.pdfimg{display:block;width:100%;padding:8px;overflow:hidden}
.pdfimg img{display:block;width:100%;border-radius:10px}
.pdfimg span{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--sub);padding-top:6px}
.pdfimg span svg{width:14px;height:14px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#zoom.on{display:block}
#zoom img{display:block;width:200%;max-width:none;margin-top:calc(env(safe-area-inset-top) + 56px)}
#zoom button{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:14px;background:rgba(255,255,255,.9);color:#111;border-radius:99px;padding:8px 14px;font-weight:700;z-index:51}
</style>
</head>

 {n:"有害ごみ",i:"battery-warning",c:"#d63447",t:["3"],k:"有害"},
 {n:"紙・段ボール",i:"package",c:"#a8743a",t:["7","8","6","9"],k:"雑誌"},
 {n:"びん・かん・ペット",i:"recycle",c:"#2e9e5b",t:["12","11","13"],k:"びん"},
 {n:"小型家電・金属",i:"smartphone",c:"#546e7a",t:["4","5"],k:"金属"},
 {n:"古着・古布",i:"shirt",c:"#9b59b6",t:["10"],k:"古布"},
 {n:"粗大ごみ",i:"sofa",c:"#5c5f66",t:["15"],sub:"電話で予約"},
 {n:"出せないもの",i:"ban",c:"#3f4247",t:["16","17","18","20","22","23","25"],sub:"家電4品目など"},
];
const HOWTO={"1":"kanen","19":"kanen","21":"kanen","2":"funen","24":"pura","3":"yugai","7":"zasshi","6":"shinbun","4":"kaden","5":"kaden","8":"danboru","9":"kamipack","10":"furugi","12":"bin","13":"pet","11":"kan"};
const howImg=t=>HOWTO[t]?`<button class="card pdfimg" onclick="zoom('howto/${HOWTO[t]}.jpg')"><img src="howto/${HOWTO[t]}.jpg" loading="lazy" alt="市のカレンダーの出し方"><span>${ic("search")}市のカレンダーより・押すと拡大</span></button>`:"";
function zoom(src){const z=document.getElementById("zoom");z.querySelector("img").src=src;z.classList.add("on")}
const QUICK=["厚紙","ピザの箱","紙コップ","アルミホイル","電池","スプレー缶","フライパン","傘","ハンガー","レシート","キャップ","保冷剤"];
// 収集日（令和8年版 上田・宮・万願寺・石田・新井 から。基準 2026-11-02(月)）
const DAY=864e5,BASE=Date.UTC(2026,10,2),LIMIT=new Date(2026,11,31);
function cols(dt){
  const u=Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()),m=dt.getMonth()+1,d=dt.getDate();
  if((m==12&&d>=29)||(m==1&&d<=3))return[];
  const w=dt.getDay(),wk=Math.floor((u-BASE)/DAY/7),ev=((wk%2)+2)%2==0,c4=((wk%4)+4)%4,r=[];
  if(w==1||w==4)r.push("可燃");
  if(w==1&&ev)r.push("段ボール");
  if(w==2&&ev)r.push("雑誌");
  if(w==3){r.push("プラ","有害");r.push(...[["びん","金属"],["ペット"],["びん","新聞"],["不燃"]][c4]);}
  if(w==4&&ev)r.push("紙パック","古布");
  if(w==5&&ev)r.push("かん");
  return r;
}
const W="日月火水木金土";
const today=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
const fmt=d=>`${md(d)}(${W[d.getDay()]})`;
function nextOf(k){const t=today();for(let i=0;i<60;i++){const d=add(t,i);if(cols(d).includes(k))return{d,i}}return null}
const rel=x=>!x?"":x.i==0?"今日":x.i==1?"明日":fmt(x.d);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kana=s=>s.normalize("NFKC").replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)).toLowerCase();
const tint=(c,a)=>c+Math.round(a*255).toString(16).padStart(2,"0");
let DATA,catStack=null;
// 表記ゆれ：小さい文字・長音・中黒・空白をそろえる（「マニュキア」でも「マニキュア」が出るように）
const fold=s=>s.replace(/[ァィゥェォャュョッヮ]/g,c=>"アイウエオヤユヨツワ"["ァィゥェォャュョッヮ".indexOf(c)]).replace(/[ー・\s（）()、。]/g,"");
const bi=s=>{const r=new Set();for(let i=0;i<s.length-1;i++)r.add(s.slice(i,i+2));return r};

/* ---------- 今日 ---------- */
function renderHome(){
  const t=today(),tc=cols(t),tm=cols(add(t,1));
  const pills=k=>k.length?`<div class="pills">${k.map(x=>`<div class="pill" style="background:${C[x].c}"><span class="ic">${ic(C[x].i)}</span>${C[x].s}</div>`).join("")}</div>`
    :`<div class="none">${ic("ban")}収集はありません</div>`;
  let week="";for(let i=0;i<7;i++){const d=add(t,i),k=cols(d);
    week+=`<div class="row ${i==0?"today":""}"><div class="dt">${md(d)}<small>${i==0?"今日":i==1?"明日":W[d.getDay()]+"曜"}</small></div><div class="dots">${k.length?k.map(x=>`<span class="dot" style="background:${tint(C[x].c,.14)};color:${C[x].c}">${ic(C[x].i)}${C[x].s}</span>`).join(""):`<span style="color:var(--sub);font-size:13px">なし</span>`}</div></div>`}
  document.getElementById("v-home").innerHTML=`
   <div class="top"><h1>今日のごみ</h1><small>万願寺地区</small></div>
   <div class="card hero"><div class="d"><b>${fmt(t)}</b><span>朝8時までに</span></div>${pills(tc)}</div>
   <div class="sec">明日 ${fmt(add(t,1))}</div>
   <div class="card hero" style="padding-top:2px">${pills(tm)}</div>
   <div class="sec">この先1週間</div>
   <div class="card week">${week}</div>
   ${t>LIMIT?`<div class="card tip">${ic("calendar-days")}2027年の収集日は未登録です。来年版のカレンダーで確認してください。</div>`:""}`;
}

/* ---------- 分別 ---------- */
function renderSort(){
  const v=document.getElementById("v-sort");
  if(catStack!==null){renderCat(CATS[catStack]);return}
  v.innerHTML=`
   <div class="top"><h1>分別</h1><small>849品目</small></div>
   <div class="search"><label class="sbox">${ic("search")}<input id="q" type="search" placeholder="品名で検索（ひらがなOK）" autocomplete="off"><button class="x" id="qx">消す</button></label></div>
   <div id="res"></div>
   <div id="home2">
    <div class="sec" style="margin-top:6px">よく迷うもの</div>
    <div class="chips">${QUICK.map(q=>`<button class="chip" data-q="${q}">${q}</button>`).join("")}</div>
    <div class="sec">種類から探す</div>
    <div class="grid">${CATS.map((c,i)=>{const nx=c.k?nextOf(c.k):null;
      return `<button class="card tile" data-cat="${i}"><span class="badge" style="background:${c.c}">${ic(c.i)}</span><b>${c.n}</b><small>${c.k?"次の回収 "+rel(nx):c.sub}</small></button>`}).join("")}</div>
   </div>`;
  const q=v.querySelector("#q");
  q.oninput=()=>search(q.value);
  v.querySelector("#qx").onclick=()=>{q.value="";search("")};
  v.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{q.value=b.dataset.q;search(b.dataset.q)});
  v.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{catStack=+b.dataset.cat;renderSort();scrollTo(0,0)});
}
function row(it,idx){const [nm,,t]=it,ty=TY[t]||["ban","#555"];
  return `<button class="li" data-i="${idx}"><span class="badge" style="background:${ty[1]}">${ic(ty[0])}</span><span class="t"><b>${esc(nm)}</b><small>${esc(DATA.T[t]?.n||"")}</small></span>${ic("chevron-left","i chev").replace('class="i chev"','class="i chev" style="transform:rotate(180deg);width:18px"')}</button>`}
function bindRows(el){el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>openItem(DATA.I[+b.dataset.i]))}
function search(s){
  const res=document.getElementById("res"),h2=document.getElementById("home2"),k=kana(s.trim());
  document.getElementById("qx").style.display=k?"block":"none";
  if(!k){res.innerHTML="";h2.style.display="";return}
  h2.style.display="none";
  const kk=fold(k),hits=[];DATA.I.forEach((it,i)=>{if(fold(kana(it[0])).includes(kk)||fold(kana(it[1])).includes(kk))hits.push(i)});
  let near=[];
  if(!hits.length&&kk.length>=2){const g=bi(kk);near=DATA.I.map((it,i)=>{const nm=fold(kana(it[0])+kana(it[1])),h=bi(nm);let s=0;g.forEach(x=>{if(h.has(x))s++});
    const q=[...new Set(kk)],cov=q.filter(c=>nm.includes(c)).length/q.length;return[Math.max(s/g.size,kk.length>=3&&cov>=0.99?0.6:0),i]}).filter(x=>x[0]>=0.5).sort((a,b)=>b[0]-a[0]).slice(0,15).map(x=>x[1])}
  res.innerHTML=hits.length?`<div class="sec" style="margin-top:4px">${hits.length}件</div><div class="card list">${hits.slice(0,100).map(i=>row(DATA.I[i],i)).join("")}</div>`
   :near.length?`<div class="sec" style="margin-top:4px">ぴったりは無し。近い品目</div><div class="card list">${near.map(i=>row(DATA.I[i],i)).join("")}</div>`
   :`<div class="card empty">見つかりません。<br>別の言い方で探すか、上の「種類から探す」を使ってください（例：箱、紙、缶）</div>`;
  bindRows(res);
}
function renderCat(c){
  const v=document.getElementById("v-sort");
  let sub=c.t.filter(t=>DATA.T[t]),cur=sub[0];
  const draw=()=>{
    const T=DATA.T[cur],ty=TY[cur],nx=ty&&ty[2]?nextOf(ty[2]):null;
    const items=DATA.I.map((it,i)=>[it,i]).filter(([it])=>it[2]==cur).sort((a,b)=>a[0][1].localeCompare(b[0][1],"ja"));
    v.innerHTML=`
     <button class="back" id="bk">${ic("chevron-left")}分別</button>
     <div class="card cathead"><span class="badge" style="background:${c.c}">${ic(c.i)}</span><div><h2>${c.n}</h2><p style="color:${c.c}">${nx?"次の回収 "+rel(nx)+(nx.i>1?"":" "+fmt(nx.d)):(c.sub||"")}</p></div></div>
     ${sub.length>1?`<div class="seg">${sub.map(t=>`<button data-t="${t}" class="${t==cur?"on":""}" style="${t==cur?"background:"+TY[t][1]:""}">${esc(DATA.T[t].n)}</button>`).join("")}</div>`:""}
     ${HOWTO[cur]?`<div class="sec">出し方</div>${howImg(cur)}`:""}
     ${T.ex?`<div class="sec">主なもの</div><div class="card howto">${esc(T.ex)}</div>`:""}
     <div class="sec">${HOWTO[cur]?"出し方（文字）":"出し方"}</div><div class="card howto">${esc(T.how)}</div>
     <div class="sec">品目（${items.length}）</div>
     <div class="card list">${items.map(([it,i])=>row(it,i)).join("")}</div>`;
    v.querySelector("#bk").onclick=()=>{catStack=null;renderSort();scrollTo(0,0)};
    v.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{cur=b.dataset.t;draw()});
    bindRows(v);
  };draw();
}
function openItem(it){
  const [nm,,t,cm]=it,ty=TY[t]||["ban","#555"],T=DATA.T[t],nx=ty[2]?nextOf(ty[2]):null;
  document.getElementById("sheet").innerHTML=`<div class="grab"></div>
   <div class="sh-top"><span class="badge" style="background:${ty[1]}">${ic(ty[0])}</span><div><h2>${esc(nm)}</h2><p style="color:${ty[1]}">${esc(T?.n||"")}</p></div></div>
   ${nx?`<div class="next" style="background:${tint(ty[1],.12)};color:${ty[1]}">${ic("calendar-days")}次の回収：${nx.i<2?rel(nx)+" "+fmt(nx.d):fmt(nx.d)}</div>`:""}
   ${cm?`<div class="note">${esc(cm)}</div>`:""}
   ${HOWTO[t]?`<div class="sec" style="margin-left:0">出し方</div>${howImg(t)}`:""}
   <button class="sh-btn" onclick="closeSheet()">閉じる</button>`;
  document.getElementById("sheetwrap").classList.add("open");
}
function openDay(dt){
  const k=dt>LIMIT?[]:cols(dt);
  document.getElementById("sheet").innerHTML=`<div class="grab"></div><div class="sh-top"><div><h2>${fmt(dt)} のごみ</h2><p style="color:var(--sub)">朝8時までに出す</p></div></div>
   <div style="margin-top:14px">${k.length?k.map(x=>{const ci=CATS.findIndex(c=>c.k==x||c.t.some(tt=>TY[tt]&&TY[tt][2]==x));
     return `<button class="li" data-cat="${ci}"><span class="badge" style="background:${C[x].c}">${ic(C[x].i)}</span><span class="t"><b>${C[x].n}</b><small>出し方と品目を見る</small></span>${ic("chevron-left","i chev").replace('class="i chev"','class="i chev" style="transform:rotate(180deg);width:18px"')}</button>`}).join(""):`<div class="empty">収集はありません</div>`}</div>
   <button class="sh-btn" onclick="closeSheet()">閉じる</button>`;
  document.querySelectorAll("#sheet [data-cat]").forEach(b=>b.onclick=()=>{closeSheet();catStack=+b.dataset.cat;tab("sort")});
  document.getElementById("sheetwrap").classList.add("open");
}
function closeSheet(){document.getElementById("sheetwrap").classList.remove("open")}

/* ---------- カレンダー ---------- */
let calM;
function renderCal(){
  const t=today();if(!calM)calM=new Date(t.getFullYear(),t.getMonth(),1);
  const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
  let cells=W.split("").map(w=>`<div class="w">${w}</div>`).join("");
  for(let i=0;i<first.getDay();i++)cells+="<div></div>";
  for(let d=1;d<=days;d++){const dt=new Date(y,m,d),k=dt>LIMIT?[]:cols(dt),wd=dt.getDay();
    cells+=`<div class="c ${+dt==+t?"today":""} ${wd==0?"sun":wd==6?"sat":""}" data-d="${d}"><div class="n">${d}</div><div class="ics">${k.map(x=>`<span style="background:${C[x].c}">${ic(C[x].i)}</span>`).join("")}</div></div>`}
  const minM=new Date(2026,10,1),maxM=new Date(2026,11,1);
  document.getElementById("v-cal").innerHTML=`
   <div class="top"><h1>カレンダー</h1><small>万願寺地区</small></div>
   <div class="mhead"><button id="pm" ${calM<=minM?"disabled":""}>${ic("chevron-left")}</button><b>${y}年${m+1}月</b><button id="nm" ${calM>=maxM?"disabled":""} style="transform:rotate(180deg)">${ic("chevron-left")}</button></div>
   <div class="card cal">${cells}</div>
   <div class="sec">アイコンの見方</div>
   <div class="card legend">${Object.values(C).map(c=>`<div><span style="background:${c.c}">${ic(c.i)}</span>${c.n}</div>`).join("")}</div>
   <div class="foot">12/29〜1/3は収集なし。2027年1月以降は来年版カレンダーの配布後に更新します。<br>出典：日野市 ごみ・資源分別カレンダー令和8年版／日野市ごみ分別辞典<br>問い合わせ：ごみゼロ推進課 <a href="tel:0425810444">042-581-0444</a></div>`;
  document.querySelectorAll(".cal .c[data-d]").forEach(e=>e.onclick=()=>openDay(new Date(y,m,+e.dataset.d)));
  document.getElementById("pm").onclick=()=>{calM=new Date(y,m-1,1);renderCal()};
  document.getElementById("nm").onclick=()=>{calM=new Date(y,m+1,1);renderCal()};
}

/* ---------- タブ ---------- */
function tab(n){
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.tab==n));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id=="v-"+n));
  if(n=="home")renderHome();if(n=="sort")renderSort();if(n=="cal")renderCal();
  scrollTo(0,0);
}
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>{if(b.dataset.tab=="sort"&&b.classList.contains("on")){catStack=null}tab(b.dataset.tab)});
fetch("data.json").then(r=>r.json()).then(d=>{DATA=d;
  DATA.I.push(["厚紙・紙箱（段ボール以外：お菓子の箱、商品の台紙など）","アツガミ カミバコ ボールガミ ダイシ","7","断面が波形でなければ「雑誌・雑紙類」。ひもで縛るか紙袋に入れて出す。\n表面がツルツルで水をはじく紙（ビニールコート紙）、ろう加工紙、金紙・銀紙、汚れた紙は可燃ごみ。"]);
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("day:")){const [yy,mm,dd]=h.slice(4).split("-").map(Number);calM=new Date(yy,mm-1,1);tab("cal");openDay(new Date(yy,mm-1,dd))}
  else if(h.startsWith("cat")){catStack=+h.slice(3);tab("sort")}
  else if(h.startsWith("item:")){document.body.classList.add("noanim");tab("sort");const it=DATA.I.find(x=>x[0].startsWith(h.slice(5)));if(it)openItem(it)}
  else tab(h=="sort"?"sort":h=="cal"?"cal":"home");
});
window.addEventListener("hashchange",()=>{const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith("day:")){const [yy,mm,dd]=h.slice(4).split("-").map(Number);calM=new Date(yy,mm-1,1);tab("cal");openDay(new Date(yy,mm-1,dd))}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
